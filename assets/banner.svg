  <text x="258" y="150" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="110" font-weight="800" letter-spacing="-3" fill="url(#ink)">Fluxo</text>
  <!-- tagline -->
  <text x="262" y="196" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25" font-weight="500" letter-spacing="0.5" fill="#8a8a99">IPTV, torrents e mídia — tudo no navegador</text>
